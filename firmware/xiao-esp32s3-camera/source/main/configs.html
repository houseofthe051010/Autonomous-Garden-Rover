<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>Sense Camera Settings</title>
<style>
*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#edf1f3;color:#172027;font-family:system-ui,sans-serif}header{background:#101820;color:#fff;border-bottom:3px solid #1da58a}.bar{width:min(820px,100%);margin:auto;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:21px;margin:0}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav a{color:#fff;padding:7px 9px;text-decoration:none;border-bottom:2px solid #ffffff55;font-size:13px}
main{width:min(820px,100%);margin:auto;padding:14px 14px 50px}section{background:#fff;border:1px solid #c8d1d6;border-radius:7px;padding:14px;margin:12px 0;overflow:hidden}h2{font-size:17px;margin:0 0 12px}.row{display:grid;grid-template-columns:minmax(145px,1fr) minmax(150px,1.4fr) 64px;gap:10px;align-items:center;margin:13px 0}.toggle{grid-template-columns:minmax(145px,1fr) 1fr 64px}select,input[type=range]{width:100%;min-width:0}select{background:#f7f9fa;color:#172027;border:1px solid #aebbc2;border-radius:5px;padding:8px}input[type=checkbox]{width:22px;height:22px}.value{text-align:right;color:#4d5e68;font-variant-numeric:tabular-nums}.message{position:sticky;bottom:8px;background:#101820ee;color:#fff;border-radius:6px;padding:10px;text-align:center;min-height:40px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{border-left:4px solid #1da58a;background:#eff5f4;padding:9px}.stat small{display:block;color:#63737c}.stat strong{font-size:17px}.meter{height:9px;background:#dce4e7;overflow:hidden}.meter i{display:block;height:100%;background:#1da58a;width:0}@media(max-width:520px){.bar{align-items:flex-start;flex-direction:column}.row,.toggle{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 48px}.stats{grid-template-columns:1fr}.nav a{padding-left:0}}
</style></head><body><header><div class="bar"><h1>Camera and Microphone</h1><nav class="nav"><a href="/stream">Viewer</a><a href="/wifi">Wi-Fi</a><a href="/update">Firmware</a></nav></div></header><main>
<section><h2>System</h2><div class="stats"><div class="stat"><small>Chip temperature</small><strong id="chipTemp">--</strong></div><div class="stat"><small>Core 1 (CPU0)</small><strong id="cpu0">--</strong></div><div class="stat"><small>Core 2 (CPU1)</small><strong id="cpu1">--</strong></div><div class="stat"><small>PSRAM used / total</small><strong id="psram">--</strong></div></div></section>
<section><h2>Microphone</h2><div class="row"><label for="micGain">Capture gain</label><input id="micGain" type="range" min="-12" max="30" step="0.5"><span id="micGainValue" class="value">0 dB</span></div><div class="meter"><i id="micMeter"></i></div><div class="stats"><div class="stat"><small>RMS level</small><strong id="rms">--</strong></div><div class="stat"><small>Peak level</small><strong id="peak">--</strong></div><div class="stat"><small>Clipped / dropped</small><strong id="loss">--</strong></div></div></section>
<section><h2>Image</h2><div class="row"><label for="framesize">Resolution</label><select id="framesize" data-camera><option value="qvga">QVGA 320x240</option><option value="vga">VGA 640x480</option><option value="svga">SVGA 800x600</option><option value="xga">XGA 1024x768</option><option value="sxga">SXGA 1280x1024</option><option value="uxga">UXGA 1600x1200</option><option value="qxga">QXGA 2048x1536</option></select><span></span></div><div class="row"><label for="quality">JPEG compression (higher = smaller)</label><input id="quality" data-camera type="range" min="4" max="63"><span class="value"></span></div><div class="row"><label for="stream_fps">Frame-rate limit</label><select id="stream_fps" data-camera><option value="10">10 FPS</option><option value="15">15 FPS</option><option value="20">20 FPS</option><option value="25">25 FPS</option><option value="30">30 FPS</option><option value="0">Unlimited</option></select><span></span></div><div class="row"><label for="brightness">Brightness</label><input id="brightness" data-camera type="range" min="-2" max="2"><span class="value"></span></div><div class="row"><label for="contrast">Contrast</label><input id="contrast" data-camera type="range" min="-2" max="2"><span class="value"></span></div><div class="row"><label for="saturation">Saturation</label><input id="saturation" data-camera type="range" min="-2" max="2"><span class="value"></span></div><div class="row"><label for="sharpness">Sharpness</label><input id="sharpness" data-camera type="range" min="-3" max="3"><span class="value"></span></div></section>
<section><h2>Orientation and automatic controls</h2><div class="row toggle"><label for="hmirror">Horizontal mirror</label><input id="hmirror" data-camera type="checkbox"><span></span></div><div class="row toggle"><label for="vflip">Vertical flip</label><input id="vflip" data-camera type="checkbox"><span></span></div><div class="row toggle"><label for="awb">Auto white balance</label><input id="awb" data-camera type="checkbox"><span></span></div><div class="row toggle"><label for="awb_gain">AWB gain</label><input id="awb_gain" data-camera type="checkbox"><span></span></div><div class="row toggle"><label for="agc">Auto gain</label><input id="agc" data-camera type="checkbox"><span></span></div><div class="row"><label for="agc_gain">Manual gain</label><input id="agc_gain" data-camera type="range" min="0" max="30"><span class="value"></span></div><div class="row"><label for="gainceiling">Gain ceiling</label><input id="gainceiling" data-camera type="range" min="0" max="6"><span class="value"></span></div><div class="row toggle"><label for="aec">Auto exposure</label><input id="aec" data-camera type="checkbox"><span></span></div><div class="row toggle"><label for="aec2">AEC DSP</label><input id="aec2" data-camera type="checkbox"><span></span></div><div class="row"><label for="aec_value">Manual exposure</label><input id="aec_value" data-camera type="range" min="0" max="1200"><span class="value"></span></div><div class="row"><label for="ae_level">AE level</label><input id="ae_level" data-camera type="range" min="-2" max="2"><span class="value"></span></div></section>
<section><h2>Sensor processing</h2><div class="row"><label for="wb_mode">White balance</label><select id="wb_mode" data-camera><option value="0">Auto</option><option value="1">Sunny</option><option value="2">Cloudy</option><option value="3">Office</option><option value="4">Home</option></select><span></span></div><div class="row"><label for="special_effect">Effect</label><select id="special_effect" data-camera><option value="0">None</option><option value="1">Negative</option><option value="2">Grayscale</option><option value="3">Red tint</option><option value="4">Green tint</option><option value="5">Blue tint</option><option value="6">Sepia</option></select><span></span></div><div class="row toggle"><label for="dcw">Downsize</label><input id="dcw" data-camera type="checkbox"><span></span></div><div class="row toggle"><label for="bpc">Black-pixel correction</label><input id="bpc" data-camera type="checkbox"><span></span></div><div class="row toggle"><label for="wpc">White-pixel correction</label><input id="wpc" data-camera type="checkbox"><span></span></div><div class="row toggle"><label for="raw_gma">Gamma correction</label><input id="raw_gma" data-camera type="checkbox"><span></span></div><div class="row toggle"><label for="lenc">Lens correction</label><input id="lenc" data-camera type="checkbox"><span></span></div><div class="row toggle"><label for="colorbar">Test color bars</label><input id="colorbar" data-camera type="checkbox"><span></span></div><div class="row"><label for="led_intensity">White LED</label><input id="led_intensity" data-camera type="range" min="0" max="255"><span class="value"></span></div></section>
<div id="message" class="message">Loading settings</div></main><script>
const message=document.getElementById('message');function showValue(el){const out=el.parentElement.querySelector('.value');if(out)out.textContent=el.value}async function setCamera(el){const val=el.type==='checkbox'?(el.checked?1:0):el.value;showValue(el);message.textContent='Applying '+el.id;try{const r=await fetch('/control?var='+encodeURIComponent(el.id)+'&val='+val,{cache:'no-store'});if(!r.ok)throw Error();message.textContent='Saved '+el.id}catch(_){message.textContent='Could not change '+el.id}}
document.querySelectorAll('[data-camera]').forEach(el=>{el.addEventListener('change',()=>setCamera(el));if(el.type==='range')el.addEventListener('input',()=>showValue(el))});
const micGain=document.getElementById('micGain');let gainTimer;function gainLabel(){document.getElementById('micGainValue').textContent=Number(micGain.value).toFixed(1)+' dB'}micGain.addEventListener('input',()=>{gainLabel();message.textContent='Mic gain '+Number(micGain.value).toFixed(1)+' dB';clearTimeout(gainTimer);gainTimer=setTimeout(async()=>{const r=await fetch('/api/audio?gain_db='+encodeURIComponent(micGain.value));message.textContent=r.ok?'Mic gain saved':'Mic gain failed'},250)});
function renderSystem(s){if(!s)return;const value=v=>v==null?'--':Number(v).toFixed(1);document.getElementById('chipTemp').textContent=value(s.temperature_c)+' °C';document.getElementById('cpu0').textContent=value(s.cpu_percent[0])+'%';document.getElementById('cpu1').textContent=value(s.cpu_percent[1])+'%';document.getElementById('psram').textContent=(s.psram_used/1048576).toFixed(2)+' / '+(s.psram_total/1048576).toFixed(2)+' MiB'}
async function refresh(){try{const s=await fetch('/api/status',{cache:'no-store'}).then(r=>r.json());renderSystem(s.system);document.querySelectorAll('[data-camera]').forEach(el=>{if(s.camera[el.id]===undefined)return;if(el.type==='checkbox')el.checked=!!s.camera[el.id];else if(document.activeElement!==el)el.value=s.camera[el.id];showValue(el)});if(document.activeElement!==micGain){micGain.value=s.audio.gain_db;gainLabel()}document.getElementById('rms').textContent=s.audio.rms_dbfs.toFixed(1)+' dBFS';document.getElementById('peak').textContent=s.audio.peak_dbfs.toFixed(1)+' dBFS';document.getElementById('loss').textContent=s.audio.clipped_samples+' / '+s.audio.dropped_blocks;const pct=Math.max(0,Math.min(100,(s.audio.rms_dbfs+72)*100/72));document.getElementById('micMeter').style.width=pct+'%'}catch(_){message.textContent='Status unavailable'}}setInterval(refresh,1000);refresh();
</script></body></html>
