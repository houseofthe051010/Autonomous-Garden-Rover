<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>Sense Camera Firmware</title><style>
*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#edf1f3;color:#172027;font-family:system-ui,sans-serif}header{background:#101820;color:#fff;border-bottom:3px solid #1da58a}.bar,main{width:min(680px,100%);margin:auto}.bar{padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:21px;margin:0}.nav{display:flex;gap:10px}.nav a{color:#fff;font-size:13px}main{padding:14px}section{background:white;border:1px solid #c8d1d6;border-radius:7px;padding:14px;margin:12px 0}.build{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cell{border-left:4px solid #1da58a;background:#eff5f4;padding:10px}.cell small{display:block;color:#64747c}.cell strong{font-size:15px}input[type=file]{display:block;width:100%;border:1px solid #b6c1c7;padding:10px;margin:12px 0}label{display:flex;gap:8px;align-items:center;font-size:13px}label input{width:20px;height:20px}button{width:100%;min-height:46px;border:0;border-radius:5px;background:#087bb7;color:#fff;font-weight:750;margin-top:12px}button:disabled{background:#84919a}progress{width:100%;height:18px;margin-top:12px}#message{min-height:42px;background:#101820;color:#fff;border-radius:6px;padding:10px;margin-top:10px}@media(max-width:520px){.bar{align-items:flex-start;flex-direction:column}.build{grid-template-columns:1fr}}
</style></head><body><header><div class="bar"><h1>Firmware Update</h1><nav class="nav"><a href="/stream">Viewer</a><a href="/configs">Settings</a><a href="/wifi">Wi-Fi</a></nav></div></header><main><section><div class="build"><div class="cell"><small>Running version</small><strong id="version">--</strong></div><div class="cell"><small>OTA capacity</small><strong id="capacity">--</strong></div></div></section><section><input id="file" type="file" accept=".bin,application/octet-stream"><label><input id="confirm" type="checkbox"> Install this ESP32-S3 application image</label><button id="upload" disabled type="button">Upload firmware</button><progress id="progress" max="100" value="0"></progress><div id="message">Select an application .bin file.</div></section></main><script>
const file=document.getElementById('file'),confirmBox=document.getElementById('confirm'),upload=document.getElementById('upload'),progress=document.getElementById('progress'),message=document.getElementById('message');function ready(){upload.disabled=!file.files.length||!confirmBox.checked}file.onchange=ready;confirmBox.onchange=ready;fetch('/api/status',{cache:'no-store'}).then(r=>r.json()).then(s=>{document.getElementById('version').textContent=s.firmware.version+' | '+s.firmware.date;document.getElementById('capacity').textContent=(s.firmware.ota_capacity/1048576).toFixed(2)+' MiB'});
upload.onclick=()=>{const image=file.files[0];if(!image)return;upload.disabled=true;message.textContent='Uploading '+image.name;const xhr=new XMLHttpRequest();xhr.open('POST','/api/ota');xhr.setRequestHeader('Content-Type','application/octet-stream');xhr.setRequestHeader('X-OTA-Confirm','XIAO-S3');xhr.upload.onprogress=e=>{if(e.lengthComputable)progress.value=e.loaded*100/e.total};xhr.onload=()=>{if(xhr.status===200){progress.value=100;message.textContent='Installed. Device is restarting.';setTimeout(()=>location.href='/stream',8000)}else{message.textContent='Update failed: '+xhr.responseText;upload.disabled=false}};xhr.onerror=()=>{message.textContent='Upload connection failed';upload.disabled=false};xhr.send(image)};
</script></body></html>
