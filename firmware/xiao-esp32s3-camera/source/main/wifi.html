<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>Sense Camera Wi-Fi</title><style>
*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#edf1f3;color:#172027;font-family:system-ui,sans-serif}header{background:#101820;color:white;border-bottom:3px solid #1da58a}.bar,main{width:min(720px,100%);margin:auto}.bar{padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:21px;margin:0}.nav{display:flex;gap:10px}.nav a{color:white;font-size:13px}main{padding:14px}section{background:#fff;border:1px solid #c8d1d6;border-radius:7px;padding:14px;margin:12px 0}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cell{border-left:4px solid #1da58a;background:#eff5f4;padding:10px}.cell small{display:block;color:#64747c}.cell strong{font-size:16px}.networks{display:grid;gap:7px;margin-top:10px}.network{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border:1px solid #d3dade;padding:10px;background:#f8fafb;text-align:left;border-radius:5px}.network.selected{border:2px solid #087bb7;background:#e8f4f9}.network span{overflow:hidden;text-overflow:ellipsis}.network small{color:#60717a}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input{width:100%;min-height:43px;border:1px solid #aebbc2;border-radius:5px;padding:9px;font:16px system-ui}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}button{min-height:44px;border:1px solid #819099;border-radius:5px;background:#fff;font-weight:700}.primary{background:#087bb7;color:white;border-color:#087bb7}.danger{color:#ad2727}#message{min-height:40px;padding:10px;background:#101820;color:white;border-radius:6px;margin-top:12px}@media(max-width:520px){.bar{align-items:flex-start;flex-direction:column}.status{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
</style></head><body><header><div class="bar"><h1>Wi-Fi</h1><nav class="nav"><a href="/stream">Viewer</a><a href="/configs">Settings</a><a href="/update">Firmware</a></nav></div></header><main>
<section><div class="status"><div class="cell"><small>Direct access point</small><strong>drone camera</strong></div><div class="cell"><small>AP address</small><strong id="apIp">192.168.4.1</strong></div><div class="cell"><small>Router</small><strong id="router">Not connected</strong></div></div></section>
<section><button id="scan" class="primary" type="button">Scan networks</button><div id="networks" class="networks"></div><label for="ssid">Network name</label><input id="ssid" maxlength="32" autocomplete="off"><label for="password">Password</label><input id="password" type="password" maxlength="63" autocomplete="new-password"><label><input id="show" type="checkbox" style="width:20px;min-height:20px;vertical-align:middle"> Show password</label><div class="actions"><button id="connect" class="primary" type="button">Save and connect</button><button id="forget" class="danger" type="button">Forget router</button></div><div id="message">AP stays available while the router connection changes.</div></section>
</main><script>
const message=document.getElementById('message'),ssid=document.getElementById('ssid'),password=document.getElementById('password'),networks=document.getElementById('networks');document.getElementById('show').onchange=e=>password.type=e.target.checked?'text':'password';
async function status(){try{const s=await fetch('/api/status',{cache:'no-store'}).then(r=>r.json());document.getElementById('apIp').textContent=s.network.ap_ip;document.getElementById('router').textContent=s.network.sta_connected?s.network.sta_ssid+' | '+s.network.sta_ip+' | '+s.network.sta_rssi+' dBm':s.network.sta_configured?'Connecting to '+s.network.sta_ssid:'Not configured';if(!ssid.value&&s.network.sta_ssid)ssid.value=s.network.sta_ssid}catch(_){}}
document.getElementById('scan').onclick=async()=>{message.textContent='Scanning';networks.innerHTML='';try{const list=await fetch('/api/wifi/scan',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()});list.forEach(n=>{const b=document.createElement('button');b.className='network';const name=document.createElement('span');name.textContent=n.ssid;const signal=document.createElement('small');signal.textContent=n.rssi+' dBm';const lock=document.createElement('small');lock.textContent=n.open?'Open':'Secured';b.append(name,signal,lock);b.onclick=()=>{document.querySelectorAll('.network').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');ssid.value=n.ssid};networks.appendChild(b)});message.textContent=list.length+' networks found'}catch(_){message.textContent='Scan failed'}};
document.getElementById('connect').onclick=async()=>{message.textContent='Saving router connection';const body='ssid='+encodeURIComponent(ssid.value)+'&password='+encodeURIComponent(password.value);try{const r=await fetch('/api/wifi/connect',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const j=await r.json();if(!r.ok)throw Error(j.error||'failed');message.textContent='Connecting. The direct AP remains active.';password.value='';setTimeout(status,2500)}catch(e){message.textContent='Connection failed: '+e.message}};
document.getElementById('forget').onclick=async()=>{if(!confirm('Forget the saved router?'))return;const r=await fetch('/api/wifi/forget',{method:'POST'});message.textContent=r.ok?'Router forgotten; direct AP remains active':'Could not forget router';ssid.value='';password.value='';status()};setInterval(status,2000);status();
</script></body></html>
