name: Bug report
description: Report a reproducible software, firmware, or documentation problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, controller keys, Wi-Fi passwords, or unsafe live-motion commands.
  - type: dropdown
    id: target
    attributes:
      label: Affected target
      options:
        - ESP32-P4 host
        - STM32 drivetrain
        - GD32 stepper controller
        - ESP32 hose controller
        - ODESC V4.2
        - Documentation or repository tooling
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include safe reproduction steps and the expected result.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Hardware and firmware details
      description: Board revision, firmware revision, wiring changes, and sanitized logs.
